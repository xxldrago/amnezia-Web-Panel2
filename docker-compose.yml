version: '3.8'

services:
  app:
    build: .
    container_name: vpn_panel_app
    restart: always
    env_file: .env
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-vpnuser}:${DB_PASSWORD:-securepassword123}@db:5432/${DB_NAME:-vpndb}
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - BASE_URL=${BASE_URL:-https://yourdomain.com}
      - PLATEGA_MERCHANT_ID=${PLATEGA_MERCHANT_ID:-}
      - PLATEGA_SECRET_KEY=${PLATEGA_SECRET_KEY:-}
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
    volumes:
      - ./data:/app/data
      - ./instance:/app/instance
      - ./uploads:/app/uploads
    networks:
      - vpn_network
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: vpn_panel_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-vpnuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepassword123}
      POSTGRES_DB: ${DB_NAME:-vpndb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vpn_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vpnuser} -d ${DB_NAME:-vpndb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: vpn_panel_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:rw
      - ./certbot/conf:/etc/letsencrypt:rw
    networks:
      - vpn_network
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    container_name: vpn_panel_certbot
    restart: unless-stopped
    volumes:
      - ./certbot/www:/var/www/certbot:rw
      - ./certbot/conf:/etc/letsencrypt:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
    networks:
      - vpn_network

networks:
  vpn_network:
    driver: bridge

volumes:
  postgres_data:
